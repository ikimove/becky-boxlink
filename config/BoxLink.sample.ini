; Becky! BoxLink 設定ファイル（サンプル）
;
; 初回に右クリックメニューから起動すると、<データフォルダ>\PlugIns\BoxLink.ini が
; 自動で作成されます。このサンプルは内容の説明用です。
;
; Box Developer Console で作成したアプリ（ユーザー認証 OAuth 2.0）の
; クライアントID とクライアントシークレットを設定してください。
; リダイレクトURI には http://localhost:<redirect_port>/callback を登録します。

[box]
client_id=
client_secret=
redirect_port=53682

[link]
; 有効期限の既定値（1=設定する / 0=しない）と日数
expire_enabled=1
expire_days=14
; ワンタイムパスコード（メール認証）の既定値
otp_enabled=1
; ダウンロードを許可するか
can_download=1

[browse]
; フォルダ一覧の起点にする Box フォルダの ID（0=すべてのファイル）
; ID は Box の Web 画面でフォルダを開いたときの URL https://app.box.com/folder/<ID> の数字
root_folder_id=0
; 起点フォルダの表示名（API 呼び出しを省くため設定ファイルで指定。空なら ID を表示）
root_folder_name=

[insert]
; paste=カーソル位置に貼り付け / bottom=本文の末尾に追加 / clipboard=コピーのみ
mode=paste
