name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Becky! 2 は 32bit のため Win32 でビルドする
      - name: Configure
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/BoxLink.dll dist/
          Copy-Item config/BoxLink.sample.ini dist/
          Copy-Item README.md dist/BoxLink-README.md

      - uses: actions/upload-artifact@v4
        with:
          name: BoxLink-x86
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/* -DestinationPath BoxLink-${{ github.ref_name }}-x86.zip
          gh release create ${{ github.ref_name }} BoxLink-${{ github.ref_name }}-x86.zip --title ${{ github.ref_name }} --generate-notes
